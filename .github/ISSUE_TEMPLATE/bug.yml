name: Bug
description: A plugin loads but does the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a plugin loads but a skill, hook or command behaves wrongly.
        Use the Install problem form when the plugin does not load.
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin name, as the README's plugin table lists it.
      placeholder: triz
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The `version` in the plugin's `plugin.json`, or the commit you installed from.
    validations:
      required: false
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Claude Code CLI
        - Claude Code desktop app
        - Codex
        - Oh-My-Pi
        - Hermes CLI or server
        - Hermes desktop app
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The prompt you gave, what the plugin did, and any output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened, and where the plugin's README or skill says so.
    validations:
      required: true
