name: conformance

# Runs the repository's two checks: the Agent Plugins 1.0.0 conformance check,
# and that every generated file equals what its source produces. One short job
# on a hosted Linux runner, no services, no model calls.
#
# `push` is restricted to `main`. Without that restriction a pull request from
# a branch in this repository triggers the workflow twice — once for the push
# to the branch and once for the pull request — for one identical result.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit sha rather than a tag, because a tag
      # can be moved to point at different code; the trailing comment records
      # which release each sha is.
      #
      # Linux checkout keeps symlinks as symlinks, which this check depends
      # on: it verifies where they resolve.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `jsonschema` validates the manifest against the published schema
      # vendored in tools/schemas/; `pyyaml` reads SKILL.md frontmatter. Both
      # are pinned so a rerun of an old commit installs what it installed then.
      - name: Install check dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.26.0 pyyaml==6.0.3

      - name: Check conformance
        run: python tools/check-conformance.py

      # tools/regenerate.sh installs doctoc from tools/package-lock.json and
      # runs it on the Node major pinned here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Installs jq only where the runner image does not already carry it.
      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      # `--intent-to-add` makes a generated file missing from the commit show
      # in `git diff`, which otherwise ignores untracked files.
      - name: Check generated files
        run: |
          bash tools/regenerate.sh
          git add --intent-to-add --all
          git diff --exit-code || {
            echo "::error::Generated files differ from their sources. Run bash tools/regenerate.sh and commit the result."
            exit 1
          }
