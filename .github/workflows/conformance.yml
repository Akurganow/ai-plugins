name: conformance

# Runs the repository's two checks: the Agent Plugins 1.0.0 conformance check,
# and the release-link check that holds the release URLs under `plugins/` and
# in README.md — those two, and not the rest of the tree — to the tag
# plugins/howp/binaries.json records. Both are in one job because
# they cost nothing between them: one short job on a hosted Linux runner, no
# services, no model calls.
#
# `push` is restricted to `main`. Without that restriction a pull request from
# a branch in this repository triggers the workflow twice — once for the push
# to the branch and once for the pull request — for one identical result.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit sha rather than a tag, because a tag
      # can be moved to point at different code; the trailing comment records
      # which release each sha is.
      #
      # Linux checkout keeps symlinks as symlinks, which this check depends
      # on: it verifies where they resolve.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `jsonschema` validates the manifest against the published schema
      # vendored in tools/schemas/; `pyyaml` reads SKILL.md frontmatter. Both
      # are pinned so a rerun of an old commit installs what it installed then.
      - name: Install check dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          jsonschema==4.26.0 pyyaml==6.0.3

      - name: Check conformance
        run: python tools/check-conformance.py

      # Standard library only, which is why the pinned install above is
      # untouched. It runs as its own step so a failure names which check
      # failed without anyone reading the log twice.
      - name: Check release links
        run: python tools/check-release-links.py
