name: evals

# Measures each skill of a released package in Claude Code, Codex and Oh-My-Pi.
# It reports whether the skill triggers on matching prompts, stays quiet on near
# misses, and improves the answer. release.yml calls it with the tags it
# created. workflow_dispatch runs it for existing tags, which gives each package
# a baseline before its next release.
on:
  workflow_call:
    inputs:
      tags:
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      OPENAI_API_KEY:
        required: true
      OPENROUTER_API_KEY:
        required: true
      TYPESAFE_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tags:
        description: Release tags separated by spaces, such as "triz--v0.2.0"
        type: string
        required: true

permissions:
  contents: read

env:
  MARKETPLACE: ai-plugins

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: list
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          matrix=$(python tools/evals.py matrix --tags "$TAGS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

  # One job per skill, client and repeat, each on its own runner: concurrent
  # sessions of one client sharing one configuration were never tested.
  run:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      CLIENT: ${{ matrix.client }}
      PACKAGE: ${{ matrix.package }}
      # Keeps Claude Code at the version the record names for the whole job
      # (documentation: https://code.claude.com/docs/en/setup, "Disable auto-updates",
      # read 2026-10-08).
      DISABLE_AUTOUPDATER: "1"
    steps:
      # Neither checkout keeps the job token in .git/config, because a session can
      # read the file and its answer is published. tools/evals.py runs Codex with
      # --sandbox danger-full-access, which runs without sandbox restrictions
      # (documentation: https://learn.chatgpt.com/docs/sandboxing, read 2026-10-09).
      # It runs Oh-My-Pi with --auto-approve, which forces yolo tier approval
      # (documentation: https://github.com/can1357/oh-my-pi/blob/40e9368ef0458fd9073329cdff4174895f91bc6b/docs/cli-reference.md#L145).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The package is installed from the tag, so the run measures what was
      # released. The runner and the cases come from the workflow's own ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.tag }}
          path: released
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - if: matrix.client != 'omp'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Oh-My-Pi installs at its latest release, so its runtime does too.
      - if: matrix.client == 'omp'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install the client and the released package
        run: |
          case "$CLIENT" in
            claude)
              npm install -g @anthropic-ai/claude-code@latest
              claude plugin marketplace add "$PWD/released"
              claude plugin install "$PACKAGE@$MARKETPLACE" ;;
            codex)
              npm install -g @openai/codex@latest
              codex plugin marketplace add "$PWD/released"
              codex plugin add "$PACKAGE@$MARKETPLACE" ;;
            omp)
              bun install -g @oh-my-pi/pi-coding-agent@latest
              omp plugin marketplace add "$PWD/released"
              omp plugin install "$PACKAGE@$MARKETPLACE" ;;
          esac
          "$CLIENT" --version

      # Each client gets only its own key. Codex's documentation says not to set
      # CODEX_API_KEY at job level in a workflow that runs repository code
      # (documentation: https://learn.chatgpt.com/docs/non-interactive-mode, read 2026-10-08).
      - name: Run the skill
        env:
          ANTHROPIC_API_KEY: ${{ matrix.client == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          CODEX_API_KEY: ${{ matrix.client == 'codex' && secrets.OPENAI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ matrix.client == 'omp' && secrets.OPENROUTER_API_KEY || '' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TAG: ${{ matrix.tag }}
          SKILL: ${{ matrix.skill }}
          REPEAT: ${{ matrix.repeat }}
        run: >-
          python tools/evals.py run --tag "$TAG" --skill "$SKILL" --client "$CLIENT"
          --repeat "$REPEAT" --out "$RUNNER_TEMP/run.json"

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ matrix.tag }}-${{ matrix.skill }}-${{ matrix.client }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/run.json
          if-no-files-found: ignore
          # A re-run of a failed job uploads under the same name, and the action
          # fails when the first attempt's artifact exists (source:
          # https://github.com/actions/upload-artifact/blob/cf430e030ddbb5b0abf93d22962f4752f3646cd9/action.yml#L37-L42).
          overwrite: true

  report:
    needs: [matrix, run]
    # Not always(): that also runs after a cancel, and would replace a release's
    # complete evals.json with a partial one (documentation:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/expressions#always,
    # read 2026-10-08). It does run after a failed run job: compare in
    # tools/evals.py ranges a metric only with all three repeats on both sides,
    # so a missing record cannot read as a regression.
    if: ${{ !cancelled() && needs.matrix.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: needs.matrix.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evals-*
          path: ${{ runner.temp }}/runs
      - name: Publish the results
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          mkdir -p "$RUNNER_TEMP/runs"
          python tools/evals.py report --tags "$TAGS" --runs "$RUNNER_TEMP/runs"
