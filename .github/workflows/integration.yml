name: integration

# Installs every package from this checkout into Claude Code, Codex and Oh-My-Pi
# on Linux, macOS and Windows, and into Hermes on Linux and macOS.
# Claude Code, Codex and Oh-My-Pi must list every skill.
# Hermes must show each package installed and enabled. No step calls a model.
# The howp-archive job also verifies the Sigstore signature over the release's
# checksum table before it trusts that table.
#
# The windows-latest image installs Git with symlinks enabled
# (source: https://github.com/actions/runner-images/blob/ebade26c60adcb867918b31c8f8caa37343a3d39/images/windows/scripts/build/Install-Git.ps1).
# A Windows job here proves loading on that image, not on a default Git for
# Windows checkout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MARKETPLACE: ai-plugins
  HERMES_COMMIT: f97608f178d1ffeca59860195ab7da295f7c8e5f # Hermes v0.21.5, tag v2026.9.24

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.list.outputs.pairs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # One "package:skill" pair per skill directory, from each plugin.json name.
      # nullglob keeps a package without skills/ from yielding the pair "name:*".
      - id: list
        run: |
          shopt -s nullglob
          pairs=""
          for manifest in plugins/*/plugin.json; do
            root=$(dirname "$manifest")
            name=$(jq -r .name "$manifest")
            for skill_md in "$root"/skills/*/SKILL.md; do
              pairs="$pairs $name:$(basename "$(dirname "$skill_md")")"
            done
          done
          echo "pairs=${pairs# }" >> "$GITHUB_OUTPUT"
          echo "Packages and skills: ${pairs# }"

  install:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [claude, codex, omp, hermes]
        exclude:
          # Hermes 0.21.5's installer failed on the windows-latest image in run 36183358181:
          # error: Your local changes to the following files would be overwritten by checkout:
          # [X] Installation failed: git checkout f97608f178d1ffeca59860195ab7da295f7c8e5f failed (exit 1)
          # install.ps1 clones upstream main before checking out the pinned commit.
          # The result therefore depends on upstream at run time (source):
          # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/scripts/install.ps1#L20-L24
          - os: windows-latest
            client: hermes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CLIENT: ${{ matrix.client }}
      PAIRS: ${{ needs.packages.outputs.pairs }}
      # Keeps Claude Code at the pinned version
      # (documentation: https://code.claude.com/docs/en/setup, "Disable auto-updates").
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Claude Code's npm package needs Node.js 22 or later
      # (documentation: https://code.claude.com/docs/en/setup, "Install with npm").
      - if: matrix.client == 'claude' || matrix.client == 'codex'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Oh-My-Pi 18.2.8 declares bun >= 1.3.14 in its package.json engines (source,
      # as the registry serves it: https://registry.npmjs.org/@oh-my-pi/pi-coding-agent/18.2.8).
      - if: matrix.client == 'omp'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Set HERMES_HOME
        if: matrix.client == 'hermes'
        run: echo "HERMES_HOME=${{ runner.temp }}/hermes-home" >> "$GITHUB_ENV"

      # Install routes, documentation: https://code.claude.com/docs/en/setup,
      # https://developers.openai.com/codex/cli and the Oh-My-Pi README:
      # https://github.com/can1357/oh-my-pi/blob/6204b7508014bcdf12d95f0b3fd470905fd99344/README.md#L51-L55
      # Hermes: installation.md (documentation), and install.sh's usage text (source)
      # for --commit, --skip-setup and --hermes-home, both at the pinned commit:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/website/docs/getting-started/installation.md#L138-L140
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/scripts/install.sh#L172-L190
      - name: Install the client
        run: |
          case "$CLIENT" in
            claude) npm install -g @anthropic-ai/claude-code@2.1.278 && claude --version ;;
            codex)  npm install -g @openai/codex@0.155.1 && codex --version ;;
            omp)    bun install -g @oh-my-pi/pi-coding-agent@18.2.8 && omp --version ;;
            hermes)
              curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_COMMIT/scripts/install.sh" \
                | bash -s -- --commit "$HERMES_COMMIT" --skip-setup --skip-browser --hermes-home "$HERMES_HOME"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Check the Hermes version
        if: matrix.client == 'hermes'
        run: |
          version=$(hermes --version)
          printf '%s\n' "$version"
          grep -qF 'v0.21.5' <<<"$version"

      # Hermes documents installing a package from a repository. To test this checkout,
      # each package is copied into the user plugin directory, ~/.hermes/plugins, here under $HERMES_HOME.
      # A portable package sits there too and stays disabled until enabled. Documentation:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/website/docs/developer-guide/plugins/index.md#L62-L71
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/website/docs/user-guide/features/plugins.md#L127
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/website/docs/developer-guide/plugins/index.md#L748
      - name: Add the marketplace and install every package
        run: |
          names=$(printf '%s\n' $PAIRS | cut -d: -f1 | sort -u)
          case "$CLIENT" in
            claude)
              claude plugin marketplace add ./
              for name in $names; do claude plugin install "$name@$MARKETPLACE"; done
              claude plugin list ;;
            codex)
              codex plugin marketplace add ./
              for name in $names; do codex plugin add "$name@$MARKETPLACE"; done
              codex plugin list --json ;;
            omp)
              omp plugin marketplace add ./
              for name in $names; do omp plugin install "$name@$MARKETPLACE"; done
              omp plugin list ;;
            hermes)
              plugins_dir="$HERMES_HOME/plugins"
              mkdir -p "$plugins_dir"
              for name in $names; do
                cp -R "plugins/$name" "$plugins_dir/$name"
                hermes plugins enable "$name"
              done
              hermes plugins list ;;
          esac

      # claude plugin details prints a component inventory (documentation:
      # https://code.claude.com/docs/en/plugins/cli-reference, "plugin details").
      # codex debug prompt-input renders the model-visible prompt (documentation:
      # https://learn.chatgpt.com/docs/developer-commands); running it shows the skill catalogue there.
      # omp read is documented only by its own --help in 18.2.8 (running).
      # It resolves skill://<name> to that skill's SKILL.md (documentation):
      # https://github.com/can1357/oh-my-pi/blob/6204b7508014bcdf12d95f0b3fd470905fd99344/docs/skills.md#L169
      # Each pattern matches the line naming the skill, because a package's name
      # or description can contain the skill name.
      - name: Assert every skill is listed
        if: matrix.client != 'hermes'
        run: |
          if [ "$CLIENT" = codex ]; then codex_prompt=$(codex debug prompt-input); fi
          inventory() {
            case "$CLIENT" in
              claude) claude plugin details "$1@$MARKETPLACE" ;;
              codex)  printf '%s\n' "$codex_prompt" ;;
              omp)    omp read "skill://$2:raw" ;;
            esac
          }
          status=0
          for pair in $PAIRS; do
            name=${pair%%:*}
            skill=${pair#*:}
            case "$CLIENT" in
              claude) expected="^  Skills \([0-9]+\)  (.*, )?$skill(,|\$)" ;;
              codex)  expected="- $name:$skill: " ;;
              omp)    expected="^name: $skill\$" ;;
            esac
            if ! out=$(inventory "$name" "$skill" 2>&1); then
              printf '%s\n' "$out"
              echo "::error::$CLIENT could not list $name"
              status=1
              continue
            fi
            # A here-string, not a pipe: grep -q exits on the first match, and
            # pipefail would report the writer's broken pipe as a failure.
            if grep -qE -- "$expected" <<<"$out"; then
              echo "::group::$CLIENT lists $name:$skill"
              printf '%s\n' "$out"
              echo "::endgroup::"
            else
              printf '%s\n' "$out"
              echo "::error::$CLIENT does not list skill $skill of $name"
              status=1
            fi
          done
          exit "$status"

      # Hermes 0.21.5 has no command that prints a portable package's skills
      # without a model call, so this checks install and enable only.
      # Source, at the pinned commit:
      # plugins show prints name, version, description, Status, Source, Key, Emits and Listens:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/hermes_cli/plugins_cmd.py#L1814-L1836
      # plugins list --json carries name, status, version, description, source and removed:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/hermes_cli/plugins_cmd.py#L1672-L1703
      # skills list reads skill directories only, never the plugin-skill registry:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/hermes_cli/skills_hub.py#L782-L828
      # Only the model-facing skills_list tool returns agent-plugin-<slug>-<sha256[:8]>:<skill>:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/tools/skills_tool.py#L234-L259
      # The namespace is built by _portable_skill_namespace:
      # https://github.com/NousResearch/hermes-agent/blob/f97608f178d1ffeca59860195ab7da295f7c8e5f/hermes_cli/plugins_manifest.py#L60-L64
      - name: Assert every package is installed and enabled (Hermes)
        if: matrix.client == 'hermes'
        run: |
          status=0
          for name in $(printf '%s\n' $PAIRS | cut -d: -f1 | sort -u); do
            if ! out=$(hermes plugins show "$name" 2>&1); then
              printf '%s\n' "$out"
              echo "::error::hermes could not show $name"
              status=1
              continue
            fi
            if grep -qxF -- "Key: $name" <<<"$out" && grep -qxF -- "Status: enabled" <<<"$out"; then
              echo "::group::hermes has $name installed and enabled"
              printf '%s\n' "$out"
              echo "::endgroup::"
            else
              printf '%s\n' "$out"
              echo "::error::hermes does not show $name as enabled"
              status=1
            fi
          done
          exit "$status"

      # Not run. Codex 0.155.1's loader returns no hooks for an Agent Plugins package,
      # and its config parser skips a plugin_hooks toggle (source, at rust-v0.155.1):
      # https://github.com/openai/codex/blob/be2951ea34f0d295ed0becf97079f92fa5f6950e/codex-rs/core-plugins/src/loader.rs#L954-L964
      # https://github.com/openai/codex/blob/be2951ea34f0d295ed0becf97079f92fa5f6950e/codex-rs/features/src/lib.rs#L607-L609
      # The notice's "removed" is the feature's stage, lib.rs L238-L239 at the same commit.
      # Upstream hook loading, in Codex's issue tracker:
      # https://github.com/openai/codex/issues/39895,
      # https://github.com/openai/codex/issues/47925
      - name: Report the prose-discipline hook check as not run (Codex)
        if: matrix.client == 'codex'
        run: echo "::notice::Hook check not run - Codex 0.155.1 lists plugin_hooks as removed, and debug prompt-input runs no plugin hook."

  # Mirrors the howp skill's platform gate: one binaries.json target must match
  # uname -s and uname -m. A platform with no target is refused, not built.
  howp-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # The identity Fulcio writes into the signing certificate for a GitHub
    # Actions token is `https://github.com/` followed by the workflow ref
    # (source: `identity=` in
    # https://github.com/Akurganow/how-possible/blob/392cb5d40b38540129293deb9abec75bc48b12c4/.github/scripts/release-publish.sh).
    # The certificate inside howp-v0.3.7's SHA256SUMS.sigstore.json carries
    # this SAN and this issuer (release asset, read 2026-09-26).
    env:
      SIGNER_IDENTITY: https://github.com/Akurganow/how-possible/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned by commit. At this commit the action installs cosign v3.0.6
      # (`default:` in
      # https://github.com/sigstore/cosign-installer/blob/6f9f17788090df1f26f669e9d70d6ae9567deba6/action.yml)
      # and supports the GitHub-provided Linux, macOS and Windows runners
      # (its README L11 at the same commit, documentation).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the archive for this platform, verify the checksum table's signature and the archive's sha256
        run: |
          manifest="$GITHUB_WORKSPACE/plugins/howp/binaries.json"
          os=$(uname -s)
          arch=$(uname -m)
          matches=$(jq -c --arg os "$os" --arg arch "$arch" '[.targets[] | select(.os == $os and .arch == $arch)]' "$manifest")
          count=$(jq length <<<"$matches")
          if [ "$count" -eq 0 ] && [ "$RUNNER_OS" = Windows ]; then
            echo "binaries.json names no target for $os/$arch, so the skill refuses this platform."
            exit 0
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::$count targets in binaries.json match $os/$arch; the skill needs exactly one."
            exit 1
          fi
          target=$(jq -c '.[0]' <<<"$matches")
          field() { jq -r --arg k "$1" '.[$k]' <<<"$target"; }
          archive=$(field archive)
          url=$(field url)
          sha=$(field sha256)
          root=$(field root)
          bin_dir=$(field bin_dir)
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" "$url"
          if command -v shasum >/dev/null; then sum="shasum -a 256"; else sum=sha256sum; fi
          printf '%s  %s\n' "$sha" "$archive" | $sum -c -
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o SHA256SUMS "${url%/*}/SHA256SUMS"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o SHA256SUMS.sigstore.json "${url%/*}/SHA256SUMS.sigstore.json"
          # A sha256 ties the archive to the table; the signature ties the table
          # to the workflow that built the binaries. A table swapped on the
          # release page fails here instead of vouching for the swap.
          # Command shape: verify-blob with --bundle, --certificate-identity and
          # --certificate-oidc-issuer (documentation:
          # https://github.com/sigstore/docs/blob/842c30981f1bf5061fe0d370512db4de8cdf3b33/content/en/cosign/verifying/verify.md#L34-L35).
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$SIGNER_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER"
          listed=$(awk -v a="$archive" '$2 == a || $2 == "*" a || $2 == "./" a { print $1 }' SHA256SUMS)
          if [ "$listed" != "$sha" ]; then
            echo "::error::The release's SHA256SUMS lists '$listed' for $archive; binaries.json says $sha."
            exit 1
          fi
          tar -xzf "$archive"
          version=$(jq -r .version "$manifest")
          # A here-string, not a pipe, for the reason given in the install job.
          for bin in $(jq -r '.binaries[]' <<<"$target"); do
            out=$("$root/$bin_dir/$bin" --version)
            printf '%s\n' "$out"
            grep -qF -- "$version" <<<"$out"
          done
