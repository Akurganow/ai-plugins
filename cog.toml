# cocogitto configuration (https://docs.cocogitto.io/reference/config).
# Each package under src/ is released on its own, from the conventional
# commits that touched its source or its shipped builds. include counts
# bundles/<name>/ and plugins/<name>/ beside the package path
# (source: https://github.com/cocogitto/cocogitto/blob/055a9fa8db8ac8ce50074d50162b48b92e9d0c47/crates/cocogitto/src/settings/mod.rs#L367-L372),
# so a commit that changes a package's builds releases it. Builds are counted
# rather than the shared tools files: a builder change then releases only the
# packages whose output it changes, and CI requires every commit to carry the
# builds it produces.

# Tags read <name>--v<version>, the form Claude Code documents for plugin
# dependencies (https://code.claude.com/docs/en/plugins/dependencies).
tag_prefix = "v"
monorepo_version_separator = "--"
generate_mono_repository_global_tag = false

# This repository merges pull requests with merge commits; each branch commit
# counts for the paths it touched, and the merge commit itself counts for none.
ignore_merge_commits = true
# Releases are cut from main only; a detached or other checkout refuses the bump.
branch_whitelist = ["main"]

# Runs in the package directory before the version commit. The jq line writes
# the new version into source.json, and the build rewrites every manifest in
# bundles/ and plugins/ from it, so the version commit carries the version in
# each copy. The build reads every package, but a package whose source did not
# change gets byte-identical output, so the version commit holds no change
# for it.
pre_package_bump_hooks = [
  "jq --arg v '{{version}}' '.version = $v' source.json > source.json.next && mv source.json.next source.json",
  "bash ../../tools/build.sh",
]

# The package changelog template names no author and writes no HTML, unlike
# the built-in one. package_template takes a custom template path
# (documentation: https://github.com/cocogitto/cocogitto/blob/8cfddce66f6eece4e5f310565737cac030be8e63/website/reference/config.md#L295-L317),
# read relative to where cog runs, the repository root here
# (source: https://github.com/cocogitto/cocogitto/blob/055a9fa8db8ac8ce50074d50162b48b92e9d0c47/crates/cocogitto/src/conventional/changelog/template.rs#L176-L182).
[changelog]
package_template = "tools/templates/changelog.tera"

# Each package writes its own CHANGELOG.md in its directory, src/<name>/ (the default).
[monorepo.packages]
cognitive-load = { path = "src/cognitive-load", include = ["bundles/cognitive-load/**", "plugins/cognitive-load/**"] }
design-review = { path = "src/design-review", include = ["bundles/design-review/**", "plugins/design-review/**"] }
prose-discipline = { path = "src/prose-discipline", include = ["bundles/prose-discipline/**", "plugins/prose-discipline/**"] }
toc-thinking = { path = "src/toc-thinking", include = ["bundles/toc-thinking/**", "plugins/toc-thinking/**"] }
triz-thinking = { path = "src/triz-thinking", include = ["bundles/triz-thinking/**", "plugins/triz-thinking/**"] }
