  - id: explain-cron-expand
    prompt: |
      I'm two weeks into this job and I'm confused by this helper in our scheduler. Can you
      walk me through what it does, line by line, and tell me what it returns for
      expand("*/15", 0, 59) and expand("9-17", 0, 23)?

      ```python
      # scheduler/cron.py
      def expand(field, lo, hi):
          out = set()
          for part in field.split(","):
              step = 1
              if "/" in part:
                  part, step = part.split("/")
                  step = int(step)
              if part == "*":
                  a, b = lo, hi
              elif "-" in part:
                  a, b = map(int, part.split("-"))
              else:
                  a = b = int(part)
              out.update(range(a, b + 1, step))
          return sorted(out)
      ```
  - id: big-o-sliding-window
    prompt: |
      I'm prepping for an interview and this solution passes, but I find it hard to follow:
      there's a loop inside a loop, and the editorial still says it's linear. What are its
      time and space complexity in Big-O, and why? Just the analysis, I don't want it
      rewritten.

      ```python
      def longest_unique_substring(s):
          seen = set()
          best = left = 0
          for right, ch in enumerate(s):
              while ch in seen:
                  seen.remove(s[left])
                  left += 1
              seen.add(ch)
              best = max(best, right - left + 1)
          return best
      ```
