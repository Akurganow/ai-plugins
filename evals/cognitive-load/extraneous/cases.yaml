  - id: promo-rules-in-my-head
    prompt: |
      honestly every time i open apply_promotions() i have to keep like eight things in my
      head at once and i still get it wrong. it's checkout/promotions.py. i'm the one who adds
      new promo types, about one a month, and teh last two each shipped with a bug.

      ```python
      def apply_promotions(cart, user, now):
          total = cart.subtotal
          for p in cart.promos:
              if p.kind == 1:
                  if not (user.tier >= 2 or (p.first_order and user.order_count == 0)) or now > p.ends_at:
                      continue
                  total -= total * p.value
              elif p.kind == 2:
                  if cart.item_count >= p.min_items:
                      if not p.stackable and cart.discount_applied:
                          continue
                      total -= p.value
                      cart.discount_applied = True
              elif p.kind == 3:
                  if user.country in p.countries and not (p.excludes_sale and any(i.on_sale for i in cart.items)):
                      if cart.discount_applied and not p.stackable:
                          continue
                      total -= min(p.value, total * 0.5)
                      cart.discount_applied = True
          return max(total, 0)
      ```

      what makes this so hard to work in, and what should i change?
  - id: export-view-review-files
    prompt: |
      Code review on our reporting app has become slow, and I would like to understand why.
      Reviewing even a two-line change to an export view means opening six or seven files.
      This is one of them, reports/views/invoice_export.py (Django 5):

      ```python
      class InvoiceExportView(TenantScopedMixin, PermissionRequiredMixin, AuditLogMixin,
                              DateRangeFilterMixin, CsvExportView):
          permission_required = "billing.export_invoice"
          model = Invoice

          def get_queryset(self):
              qs = super().get_queryset()
              return qs.filter(status__in=self.exportable_statuses)
      ```

      To know what get_queryset() returns, a reviewer has to know that:

      - TenantScopedMixin (core/mixins/tenant.py) filters by request.tenant;
      - DateRangeFilterMixin (reports/mixins.py) reads ?from= and ?to= and filters again,
        unless the user is staff;
      - CsvExportView (core/exports/base.py) extends ExportView (core/exports/views.py),
        which extends ListView and adds select_related(*self.export_relations);
      - exportable_statuses is defined on AuditLogMixin (core/mixins/audit.py), for
        historical reasons;
      - the order of the parent classes decides which of these runs first.

      We have 19 export views built this way. Two senior engineers review them and, since
      last month, two junior engineers as well. A review of a change to an export view takes
      the juniors most of a day. Please explain what makes these reviews slow and what we
      should change.
  - id: new-hires-stuck-on-events
    prompt: |
      The last three engineers who joined my team each got stuck on the same thing in their
      first month: how an order event reaches the code that handles it. One of them spent
      most of a day on it. The two of us who wrote it find it obvious, so we are probably
      not the right people to judge.

      ```ts
      // src/events/registry.ts
      export const handlers: Record<number, Array<(e: OrderEvent) => Promise<void>>> = {};

      export function on(code: number) {
        return (target: any, key: string) => {
          (handlers[code] ??= []).push(target[key]);
        };
      }

      // src/orders/OrderHandlers.ts
      export class OrderHandlers {
        @on(12) async reserveStock(e: OrderEvent) { /* ... */ }
        @on(12) @on(31) async notifyCustomer(e: OrderEvent) { /* ... */ }
        @on(47) async releaseStock(e: OrderEvent) { /* ... */ }
      }

      // src/index.ts
      import "./orders/OrderHandlers"; // registers the handlers as a side effect
      ```

      What the codes mean is on a wiki page: 12 is order placed, 31 is payment captured,
      47 is order cancelled. The dispatcher in src/events/bus.ts looks up
      handlers[event.code] and runs them in parallel.

      Why do new people find this so hard, and what would help them? I'd rather fix the code
      than write another wiki page.
  - id: carrier-onboarding-two-months
    prompt: |
      We are a team of nine working on a logistics platform. A new backend engineer takes
      about two months before they can ship a feature without help, and my VP wants that
      halved. The usual first feature is adding a shipping carrier, which we do about every
      six weeks. From the notes of our last two hires, this is what they had to learn first:

      - Adding a carrier touches four of our eleven services: carrier-registry, rate-engine,
        label-service and tracking-poller.
      - Rate rules are written in "rateflow", a YAML language we built ourselves and
        interpret at runtime. There is no editor support, and its only documentation is a
        Confluence page from 2023.
      - The services call each other through "pipe", our in-house RPC library. Its retry and
        timeout defaults differ from the HTTP client everyone already knows.
      - Carriers are identified by two-letter codes ("DH", "UP", "FX") kept in four places,
        and the four lists do not quite agree.
      - Running the stack locally needs six services in docker-compose plus the shared
        staging Kafka.

      What should we change first so the next hire becomes productive sooner? After that,
      draft three agenda items for Thursday's onboarding retrospective.
  - id: vat-bug-took-two-days
    prompt: |
      ok so i've maintained this billing code for 3 years and it still took me two days to
      find why some austrian invoices had the wrong VAT. turns out the rate gets overriden in
      a signal handler i forgot exists. this is the path one invoice line takes:

      ```python
      # billing/models.py
      class InvoiceLine(BaseLine):
          def tax(self):
              return self.net * self.rate()

      # billing/base.py
      class BaseLine(TaxableMixin, models.Model):
          class Meta:
              abstract = True

      # billing/mixins.py
      class TaxableMixin:
          def rate(self):
              if getattr(self, "rate_override", None) is not None:
                  return self.rate_override
              return settings.VAT_RATES.get(self.country, settings.DEFAULT_VAT)

      # billing/eu/overrides.py, imported from BillingConfig.ready() in billing/apps.py
      @receiver(pre_save, sender=InvoiceLine)
      def apply_reduced_rates(sender, instance, **kwargs):
          if instance.category in REDUCED_CATEGORIES.get(instance.country, ()):
              instance.rate_override = EU_REDUCED[instance.country]
      ```

      the bug was that REDUCED_CATEGORIES (in billing/eu/tables.py) had books for germany but
      not austria. a one line fix after two days. why was this so hard to find when i know
      this code inside out, and what should change so the next one doesnt take two days?
  - id: notifications-too-complex
    prompt: |
      everyone on my team says notifications/ is "too complex" but when i ask what exactly,
      nobody can say. this is the function they all complain about:

      ```python
      def send(user, kind, payload, channel=None, template=None, retry=True,
               batch=False, dry_run=False, locale=None, legacy=False):
          ch = channel or user.prefs.get(kind, {}).get("channel") or ("sms" if kind in URGENT else "email")
          tpl = (LEGACY_TEMPLATES if legacy else TEMPLATES)[ch][template or kind]
          body = render(tpl, payload, locale or (None if kind in URGENT else user.locale))
          if dry_run:
              return body
