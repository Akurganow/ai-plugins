  - id: docstring-for-reconcile
    prompt: |
      Write a Google-style docstring for this function. It's hard to follow, which is exactly
      why it needs one. No code changes, just the docstring, so I can paste it in.

      ```python
      # finance/reconcile.py
      def reconcile(statement, ledger, tolerance_cents=0):
          unmatched = []
          by_ref = {e.ref: e for e in ledger if e.ref}
          for line in statement:
              e = by_ref.pop(line.ref, None) if line.ref else None
              if e is None:
                  e = next((x for x in ledger
                            if not x.ref and abs(x.cents - line.cents) <= tolerance_cents
                            and x.date == line.date), None)
              if e is None or abs(e.cents - line.cents) > tolerance_cents:
                  unmatched.append(line)
          return unmatched, list(by_ref.values())
      ```
