  - id: tangled-cart-totals
    prompt: |
      this cart code feels tangled and i cant tell why. it works tho. thoughts?

      ```ts
      let discountApplied = false;

      function recalcTotals(cart: Cart) {
        cart.subtotal = cart.items.reduce((s, i) => s + i.price * i.qty, 0);
        if (!discountApplied) applyDiscount(cart);
        cart.total = cart.subtotal - cart.discount + cart.shipping;
      }

      function applyDiscount(cart: Cart) {
        discountApplied = true;
        cart.discount = cart.coupon ? cart.subtotal * cart.coupon.pct : 0;
        if (cart.discount > 0 && cart.subtotal - cart.discount < 50) cart.shipping = 4.99;
        recalcTotals(cart);
        discountApplied = false;
      }
      ```
