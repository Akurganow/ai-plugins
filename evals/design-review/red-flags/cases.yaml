  - id: blob-store-abstraction
    prompt: |
      quick q: is this abstraction actually right, or am I just adding a layer for nothing?
      It's src/infra/blob_store.py in our Flask app, and every upload and download goes through it.

      ```python
      class BlobStore:
          def __init__(self, s3_client, bucket):
              self._s3 = s3_client
              self._bucket = bucket

          def put(self, key, body, content_type, acl, storage_class, metadata):
              return self._s3.put_object(Bucket=self._bucket, Key=key, Body=body,
                                         ContentType=content_type, ACL=acl,
                                         StorageClass=storage_class, Metadata=metadata)

          def get(self, key):
              return self._s3.get_object(Bucket=self._bucket, Key=key)["Body"].read()

          def delete(self, key):
              return self._s3.delete_object(Bucket=self._bucket, Key=key)
      ```

      Callers almost always pass acl="private", storage_class="STANDARD", metadata={}.
  - id: sdk-client-interface
    prompt: |
      We are preparing to publish version 1.0 of our internal TypeScript SDK, which 14
      services consume. My team of three maintains it. Before we freeze the public API,
      please review the design of the HTTP client below. Something about the interface
      feels wrong to me, but I cannot say what.

      ```ts
      export interface RequestOptions {
        method: "GET" | "POST" | "PUT" | "DELETE";
        url: string;
        body?: unknown;
        headers: Record<string, string>;
        timeoutMs: number;
        retries: number;
        retryBackoff: "none" | "linear" | "exponential";
        parseJson: boolean;
        throwOnNon2xx: boolean;
        traceparent: string;
      }

      export class HttpClient {
        constructor(private readonly fetchImpl: typeof fetch) {}
        request<T>(opts: RequestOptions): Promise<T | Response> { /* ... */ }
      }
      ```

      A typical call site today:

      ```ts
      const user = (await client.request<User>({
        method: "GET", url: `${BASE}/users/${id}`, headers: {}, timeoutMs: 5000,
        retries: 3, retryBackoff: "exponential", parseJson: true,
        throwOnNon2xx: true, traceparent: ctx.traceparent,
      })) as User;
      ```

      Nearly every call site passes these same values. Two services set parseJson: false
      to stream files.
  - id: order-status-five-repos
    prompt: |
      Every time product wants a new order status it turns into a week of work and an
      incident or two. Here's how it's set up today:

      - order-service (Kotlin) owns the orders table. Status is a VARCHAR with values like
        "PAID", "PACKED", "SHIPPED".
      - billing-service (Go) consumes order.updated events from Kafka and switches on the
        status string to decide when to invoice.
      - notification-service (Node) also consumes order.updated and keeps its own map from
        status string to email template.
      - warehouse-adapter (Python) polls order-service's REST API and maps statuses to the
        warehouse vendor's codes.
      - The admin frontend (React) hardcodes a dropdown of statuses and their colours.

      Last month we added "PARTIALLY_SHIPPED". It needed PRs in all five repos, billing
      double-invoiced for a day because its switch fell through to the default branch, and
      nobody knew the warehouse adapter needed a change until the vendor complained.

      What's wrong here and what should we change first? Five teams own these services, we
      add a status maybe once a quarter, and reading an order's current state is by far the
      most common thing the consumers do.
  - id: user-service-split-plan
    prompt: |
      I am about to file the epic for splitting our UserService
      (src/main/java/com/acme/user/UserService.java, 1,900 lines). This is the plan the
      team agreed on last week:

      1. Move every read method into UserReader.
      2. Move every write method into UserWriter.
      3. Move input checks into UserValidator, called by UserWriter.
      4. Move entity-to-DTO conversion into UserMapper.
      5. Add UserFacade, which delegates every public method to one of the four classes
         above, so controllers keep a single entry point.
      6. Give each new class its own interface (IUserReader and so on) for mocking.

      Today the class has 46 public methods, called from 11 controllers. The change we make
      most often is adding a field to the user profile, which currently touches the entity,
      the DTO, the validation and two queries.

      Please assess whether this refactoring plan reduces complexity or adds to it. Then
      draft the epic description for Jira (goal, scope, acceptance criteria) for the plan
      you recommend.
