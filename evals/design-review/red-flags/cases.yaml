      3. legacy/fax_export.py: 1,100 lines nobody understands, no tests. Used by one
         customer, untouched for two years.

      Two people on the team want to start with the fax exporter because it is "the worst
      code we have".
near_miss:
  - id: fix-ttl-cache-expiry
    prompt: |
      Our cache layer (app/cache.py) keeps returning prices long after they expired. We
      construct it with TTLCache(ttl_seconds=60) and users see prices up to an hour old.
      Find the bug and fix it.

      ```python
      import time

      class TTLCache:
          def __init__(self, ttl_seconds: int):
              self._ttl = ttl_seconds
              self._data = {}

          def set(self, key, value):
              self._data[key] = (value, time.time())

          def get(self, key):
              if key not in self._data:
                  return None
              value, stored_at = self._data[key]
              if time.time() - stored_at > self._ttl * 60:
                  del self._data[key]
                  return None
              return value
      ```
  - id: pytest-session-store
    prompt: |
      Write pytest tests for this module. Use fakeredis, and cover deleting an existing
      session and deleting a missing one. The interface stays as it is, I just need coverage
      before Friday's release.

      ```python
      # app/sessions/store.py
      class SessionNotFound(Exception):
          pass

      class SessionStore:
          def __init__(self, redis):
              self._redis = redis

          def delete(self, session_id: str) -> None:
              if not self._redis.exists(f"sess:{session_id}"):
                  raise SessionNotFound(session_id)
              self._redis.delete(f"sess:{session_id}")
      ```
