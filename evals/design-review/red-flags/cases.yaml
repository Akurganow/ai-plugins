positive:
  - id: user-service-split-plan
    prompt: |
      I am about to file the epic for splitting our UserService
      (src/main/java/com/acme/user/UserService.java, 1,900 lines). This is the plan the
      team agreed on last week:

      1. Move every read method into UserReader.
      2. Move every write method into UserWriter.
      3. Move input checks into UserValidator, called by UserWriter.
      4. Move entity-to-DTO conversion into UserMapper.
      5. Add UserFacade, which delegates every public method to one of the four classes
         above, so controllers keep a single entry point.
      6. Give each new class its own interface (IUserReader and so on) for mocking.

      Today the class has 46 public methods, called from 11 controllers. The change we make
      most often is adding a field to the user profile, which currently touches the entity,
      the DTO, the validation and two queries.

      Please assess whether this refactoring plan reduces complexity or adds to it. Then
      draft the epic description for Jira (goal, scope, acceptance criteria) for the plan
      you recommend.
  - id: name-for-batch-function
    prompt: |
      I've renamed this function three times now (process_records, then normalize_and_enrich,
      then prepare_batch) and every name feels wrong. My reviewer says prepare_batch tells
      him nothing. What should I call it?

      ```python
      def prepare_batch(rows, geo_client, fx_rates, seen_ids):
          out = []
          for r in rows:
              if r["id"] in seen_ids:
                  continue
              seen_ids.add(r["id"])
              r["country"] = geo_client.lookup(r["ip"])["country"]
              r["amount_eur"] = round(r["amount"] * fx_rates[r["currency"]], 2)
              if r["country"] in ("US", "CA") and r["amount_eur"] > 10_000:
                  r["needs_review"] = True
              out.append(r)
          return out
      ```

      It's called from the nightly import (jobs/import_payments.py) and from the retry
      endpoint.
  - id: six-layer-customer-api
    prompt: |
      ok rant + question. adding ONE field (preferredLocale) to the customer API took me a
      whole day bc I had to touch six classes. our layers look like this, and every one is
      basically the same method:

      ```java
      @RestController
      class CustomerController {
        CustomerDto get(@PathVariable long id) { return facade.getCustomer(id); }
      }
      class CustomerFacade {
        CustomerDto getCustomer(long id) { return service.getCustomer(id); }
      }
      class CustomerService {
        CustomerDto getCustomer(long id) { return mapper.toDto(manager.findCustomer(id)); }
      }
      class CustomerManager {
        CustomerEntity findCustomer(long id) { return dao.findById(id); }
      }
      class CustomerDao {
        CustomerEntity findById(long id) { return repo.findById(id).orElseThrow(); }
      }
      interface CustomerRepository extends JpaRepository<CustomerEntity, Long> {}
      ```

      plus CustomerDto, CustomerEntity and CustomerMapper. the architect who set this up says
      each layer is "there for when we need it". are there too many layers or am I just being
      lazy? what would you cut?
  - id: tangled-cart-totals
    prompt: |
      this cart code feels tangled and i cant tell why. it works tho. thoughts?

      ```ts
      let discountApplied = false;

      function recalcTotals(cart: Cart) {
        cart.subtotal = cart.items.reduce((s, i) => s + i.price * i.qty, 0);
        if (!discountApplied) applyDiscount(cart);
        cart.total = cart.subtotal - cart.discount + cart.shipping;
      }

      function applyDiscount(cart: Cart) {
        discountApplied = true;
        cart.discount = cart.coupon ? cart.subtotal * cart.coupon.pct : 0;
        if (cart.discount > 0 && cart.subtotal - cart.discount < 50) cart.shipping = 4.99;
        recalcTotals(cart);
        discountApplied = false;
      }
      ```
  - id: session-delete-try-except
    prompt: |
      Every caller of our session store wraps delete() in the same try/except and it's
      driving me nuts. Is the problem the callers or the store?

      ```python
      # app/sessions/store.py
      class SessionNotFound(Exception):
          pass

      class SessionStore:
          def __init__(self, redis):
              self._redis = redis

          def delete(self, session_id: str) -> None:
              if not self._redis.exists(f"sess:{session_id}"):
                  raise SessionNotFound(session_id)
              self._redis.delete(f"sess:{session_id}")
      ```

      ```python
      # app/auth/views.py (logout), app/admin/users.py (force logout), app/jobs/expire.py
      try:
          store.delete(sid)
      except SessionNotFound:
          pass  # already gone, fine
      ```

      There are nine of these blocks in the codebase. Someone forgot one last week, and the
      cleanup job crashed on a session that had already expired.
