  - id: speed-up-monthly-report
    prompt: |
      Our monthly report endpoint takes 40 seconds for big orgs, and the profiler says the
      data layer below is where the time goes. How do I make it fast? Django 5, Postgres.

      ```python
      def monthly_report(org_id, month):
          rows = []
          for project in Project.objects.filter(org_id=org_id):
              for task in project.tasks.filter(closed_at__month=month):
                  hours = sum(e.hours for e in task.time_entries.all())
                  rows.append({"project": project.name, "task": task.title, "hours": hours})
          return rows
      ```
