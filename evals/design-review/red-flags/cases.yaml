  - id: upload-endpoint-security
    prompt: |
      Can you review this upload endpoint for security problems before we expose the API
      publicly? It's FastAPI, api/routes/uploads.py.

      ```python
      @router.post("/uploads")
      async def upload(file: UploadFile, folder: str = Form(...), user=Depends(current_user)):
          dest = os.path.join("/srv/uploads", folder, file.filename)
          with open(dest, "wb") as f:
              f.write(await file.read())
          return {"url": f"/static/{folder}/{file.filename}"}
      ```
  - id: rename-handle-to-dispatch
    prompt: |
      We agreed in code review that handle is a bad name and the new name is dispatch_event.
      Please do the rename across these two files and give me the updated code, everything
      else unchanged.

      ```python
      # bus/core.py
      class EventBus:
          def __init__(self):
              self._subs = {}

          def subscribe(self, kind, fn):
              self._subs.setdefault(kind, []).append(fn)

          def handle(self, event):
              for fn in self._subs.get(event.kind, []):
                  fn(event)
      ```

      ```python
      # bus/http.py
      def webhook(request, bus):
          bus.handle(Event.from_json(request.body))
          return 204
      ```
  - id: mermaid-service-diagram
    prompt: |
      Can you turn our service architecture into a Mermaid flowchart for the README? Just
      the diagram, no commentary.

      - order-service (Kotlin) owns the orders table and publishes order.updated to Kafka.
      - billing-service (Go) consumes order.updated.
      - notification-service (Node) consumes order.updated and sends emails through SES.
      - warehouse-adapter (Python) polls order-service's REST API and calls the warehouse
        vendor's API.
      - The admin frontend (React) calls order-service's REST API.
