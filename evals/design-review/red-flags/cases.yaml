  - id: name-for-batch-function
    prompt: |
      I've renamed this function three times now (process_records, then normalize_and_enrich,
      then prepare_batch) and every name feels wrong. My reviewer says prepare_batch tells
      him nothing. What should I call it?

      ```python
      def prepare_batch(rows, geo_client, fx_rates, seen_ids):
          out = []
          for r in rows:
              if r["id"] in seen_ids:
                  continue
              seen_ids.add(r["id"])
              r["country"] = geo_client.lookup(r["ip"])["country"]
              r["amount_eur"] = round(r["amount"] * fx_rates[r["currency"]], 2)
