positive:
  - id: vector-db-options-comparison
    prompt: |
      We're picking a vector store for a RAG feature in our product: about 20 million
      embeddings of 768 dimensions, hybrid keyword plus vector search, a team of four with no
      dedicated database admin, and a budget that rules out anything above roughly 2,000 USD a
      month. The candidates are pgvector, Qdrant, Weaviate and OpenSearch.

      Please research this properly across many sources: vendor docs, independent benchmarks,
      engineering blog posts, conference talks, user reports. Compare the four on recall,
      latency at our scale, operational burden and cost. Put the comparison in your reply, with
      the claims that matter most to our choice marked by how well supported they are.
  - id: creatine-cognition-evidence-review
    prompt: |
      I'm a 52-year-old vegetarian who has started taking creatine monohydrate for gym
      performance, and a colleague says it also helps memory and focus. Can you do an evidence
      review of that across the research literature? I'd like to know which findings hold up
      across several independent studies and which rest on a single trial. Give me the review
      in the reply, plain language is fine.
  - id: fasting-sources-agree
    prompt: |
      whats the deal with intermittent fasting for weight loss, like do the sources agree
      on anything?? i keep reading contradicting stuff. please look at lots of sources not
      just a couple and tell me what they agre on and what they dont, write it up here in
      the chat
  - id: finland-basic-income-viral-claim
    prompt: |
      A claim keeps coming up in articles about universal basic income: that Finland's
      2017-2018 trial "cut unemployment" among its participants. I've seen it in dozens of
      places and I suspect most of them trace back to the same one or two reports. Trace it
      for me: find what many sources say, work out which ones merely copy an earlier one,
      and tell me how much independent support the claim has. Answer in your reply.
  - id: bronze-age-collapse-field-survey
    prompt: |
      I'm writing a long essay on the Late Bronze Age collapse around 1200 BCE and I'd like a
      survey of the field before I choose a thesis. Cover the main explanations scholars give
      (climate, earthquakes, Sea Peoples, systems collapse, drought), and say where
      the sources converge and where they split. Read broadly, including older and newer
      work, and check that the sources are sound before relying on them. Give the survey
      in your reply.
near_miss:
  - id: who-pandemic-declaration-date
    prompt: |
      On what date did the World Health Organization declare COVID-19 a pandemic? Give me
      the date in your reply.
  - id: summarise-remote-work-page
    prompt: |
      Here is the text of one blog post. Give me a four-sentence summary in your reply.

      "Remote work and output: a look at one firm. For nine months, a 1,600-person travel
      agency in Shanghai let call-centre staff work from home four days a week while a
      control group stayed in the office. The home group completed 13% more calls, and
      quit 50% less often. Part of the gain came from fewer breaks and sick days, and part
      from a quieter working environment. After the experiment, the firm offered home
      working to everyone. Staff who chose to return to the office after that were more
      productive than they had been before, which suggests that choice mattered as well as
      location. The author notes that the study covers one firm and one type of job, and
      that results for creative or collaborative roles could differ."
  - id: find-evidence-grade-definition
    prompt: |
      I'm grepping a codebase for how a source's evidence grade gets computed, and the
      matches are below. Which file and line holds the actual definition of
      `grade_evidence`, as opposed to the calls and mentions? Answer in your reply.

      report/render.py:41:    label = grade_evidence(claim)
      report/render.py:88:    # grade_evidence is slow, cache the result
      core/grading.py:12:def grade_evidence(claim, sources=None):
      core/grading.py:57:    return grade_evidence(claim, sources=[])
      docs/grading.md:3:`grade_evidence` returns A, B or C
      tests/test_grading.py:9:    assert grade_evidence(c) == "A"
  - id: sleep-claims-site-ranking
    prompt: |
      I'm writing a section of a wellness newsletter on sleep and memory. Before I lean on
      any of these as evidence, tell me how far each can be relied on and give each one a
      tier from best to worst, with a line of reasoning per site:

      - pubmed.ncbi.nlm.nih.gov
      - sleepfoundation.org
      - mercola.com
      - healthline.com
      - nature.com/articles (Nature Communications)
      - reddit.com/r/sleep

      Put the ranked list in your reply.
