positive:
  - id: can-i-cite-wikipedia-and-statista
    prompt: |
      can I cite these in my undergrad thesis on EV adoption? which are ok as evidence and
      which arent? rate them for me

      en.wikipedia.org
      statista.com
      iea.org
      electrek.co
      a random Medium post by "ev_guru_2021"

      just reply here with a rating for each
  - id: github-repos-benchmark-evidence
    prompt: |
      Our team wants to back a claim in an internal memo that Rust web frameworks beat Go
      ones on latency. Three places we found numbers: the TechEmpower Framework Benchmarks
      repo (github.com/TechEmpower/FrameworkBenchmarks), a repo called
      github.com/someuser/rust-vs-go-speedtest with 14 stars and no commits since 2021, and
      the benchmarks game site at benchmarksgame-team.pages.debian.net. How far can each be
      relied on as evidence? Give me a tier for each in the reply.
  - id: is-this-a-reliable-source-single
    prompt: |
      is natural-news.com a reliable source for nutrition claims? I keep seeing it get cited
      in a forum I'm in and I want to know before I repeat anything from it
  - id: econ-papers-trust-ordering
    prompt: |
      Our analytics lead pasted these four items as support for "minimum wage hikes cut
      teen employment" and I need to know which can carry that weight before I put them in
      a deck. Order them from most to least dependable and say why:

      - Card & Krueger (1994), "Minimum Wages and Employment: A Case Study of the Fast-Food
        Industry in New Jersey and Pennsylvania", American Economic Review
      - Neumark & Wascher (2000), reply to Card & Krueger, American Economic Review
      - a working paper on ssrn.com with no peer review, 2023
      - a Substack post at noahpinion.blog

      Reply with the order and a tier per item.
near_miss:
  - id: install-safety-colourama
    prompt: |
      my teammate told me to pip install "colourama" for terminal colours. thats spelled
      differently from colorama, right? is that package safe to install or is it a
      typosquat? answer here pls
  - id: malware-scan-suspicious-pdf
    prompt: |
      A supplier emailed me invoice_2291.pdf and my antivirus is quiet but the sender
      address looks off. Its SHA-256 is
      3f2a9c1be6d54f0a8a7c19e0d4b7c25f6a1e8d93b04c7f52a6d8e1c9b0f347aa.
      Can you tell me whether this file is malware? Reply with what you can say about it.
  - id: licence-check-gpl-dependency
    prompt: |
      We ship a closed-source desktop app and just added the npm dependency `ffmpeg-static`
      to package.json. Is its licence compatible with proprietary distribution? Tell me
      what the licence terms mean for us, in the reply.
  - id: remote-work-productivity-agreement
    prompt: |
      I'm writing a memo for our leadership team on remote versus in-office work and
      productivity. Before I write it, what do the sources actually agree on? Please read
      widely: academic studies, company surveys, think-tank reports and press coverage. I
      also suspect many of the articles just repeat one or two famous studies, so tell me
      which sources only copy each other and which are independent. Reply with the agreed
      points and the disputed ones.
