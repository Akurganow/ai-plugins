    prompt: |
      can you make this shorter? same behaviour. it's in my .zshrc and it bugs me how long it
      is

      ```bash
      mkcd() {
        if [ -d "$1" ]; then
          cd "$1"
        else
          mkdir -p "$1"
          cd "$1"
        fi
      }
      ```
