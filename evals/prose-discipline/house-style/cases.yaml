# The package puts this skill's core rules into every session of these clients,
# so the skill need not load for its rules to apply. Claude Code adds the
# stdout of the package's SessionStart hook to the context (documentation:
# https://code.claude.com/docs/en/hooks, "SessionStart", read 2026-10-09).
# Oh-My-Pi puts a plugin rule with `alwaysApply: true` into the system prompt
# (documentation:
# https://github.com/can1357/oh-my-pi/blob/ba56afb26280a6a3195c329fa66a3f8fb52f82eb/docs/rulebook-matching-pipeline.md#L248-L262).
# Codex is absent, because it skips a plugin's hooks until the user trusts them
# (plugins/prose-discipline/README.md, "Codex").
always_on: [claude, omp]
positive:
  - id: webhook-review-comment
    prompt: |
      Reviewing a teammate's PR on our payments service. There's one thing in this diff I
      don't want merged as is, but I can't figure out how to say it without sounding like a
      jerk. Can you find it and write the comment I should leave on the PR?

      ```diff
      --- a/payments/webhooks.py
      +++ b/payments/webhooks.py
      @@ -18,3 +18,6 @@ def stripe_webhook(request):
           event = verify_signature(request)
      -    apply_payment(event["data"]["object"])
      +    try:
      +        apply_payment(event["data"]["object"])
      +    except Exception:
      +        logger.info("webhook failed")
           return Response(status=200)
      ```
  - id: export-fix-pr-description
    prompt: |
      can you clean up my notes into the PR description? our template is just Summary and
      Testing

      - spent most of yesterday chasing why the nightly export sometimes has duplicate rows
      - turns out the cursor pagination used created_at only, so rows with the same
        timestamp came back on two pages
      - switched the cursor key to (created_at, id), added a composite index in migration
        0057
      - tried an OFFSET approach first but it was way too slow on teh 40M row table,
        reverted that
      - ran the export against a staging snapshot: 0 duplicates, 41,210,377 rows, same as
        SELECT COUNT(*)
      - pytest tests/export -q all green
      - had the AI review bot look at it twice, it said LGTM
  - id: issue-triage-agent
    prompt: |
      We are adding an agent to our repository that triages new GitHub issues before a
      maintainer looks at them. Please write its instructions and reply with them. I will
      commit them as .github/agents/triage.md myself. The agent should:

      - add exactly one of the labels bug, feature or question
      - search open and closed issues for a duplicate, and when it finds one, link it and add
        the label duplicate
      - ask the reporter for a minimal reproduction when a bug report has none
      - never close an issue and never assign anyone

      The agent can run the gh CLI and has read access to the code.
  - id: go-comments-before-merge
    prompt: |
      my lead says the comments in this file are noise but i think most of them are fine.
      which ones should stay before i merge? i'll edit them myself, just tell me what to
      change and why

      ```go
      // ===================== Helpers =====================

      // This function handles parsing of the TTL string.
      func parseTTL(s string) (time.Duration, error) {
          // Step 1: trim the input
          s = strings.TrimSpace(s)
          // Step 2: parse it
          d, err := time.ParseDuration(s)
          if err != nil {
              return 0, err
          }
          // Redis rejects an EX of 0, so round sub-second TTLs up to one second.
          if d > 0 && d < time.Second {
              d = time.Second
          }
          // should work for negative values too
          return d, nil
      }
      ```
  - id: shorten-incident-update
    prompt: |
      Nobody reads my incident updates past the first two lines. Can you shorten this one
      before I post it in #status? Keep every fact, and list what you cut so I can
      double-check.

      "Hi all, just wanted to give everyone a quick update regarding the ongoing situation
      with the checkout service. At approximately 14:05 UTC our monitoring systems detected
      an elevated rate of errors, and after some investigation the team was able to determine
      that the issue was caused by an expired TLS certificate on the payments gateway. We
      have now gone ahead and renewed the certificate, and as of 14:52 UTC error rates have
      returned to normal levels. Some customers may have seen failed payments during this
      window, and we are currently in the process of identifying the affected orders so that
      we can reach out to them. We will continue to monitor the situation closely and will
      provide another update as soon as we have more information. Thanks for your patience!"
near_miss:
  - id: squash-keep-first-message
    prompt: |
      How do I squash my last four commits into one but keep the message of the oldest one
      exactly as it is? They're already pushed to my feature branch, and nobody else works on
      it.
  - id: error-messages-to-csv
    prompt: |
      Our support team wants the API's error messages in their spreadsheet. Turn this into
      CSV with the columns code, http_status and message, sorted by code. Copy every message
      word for word, typos included, because support searches for the exact text customers
      paste into tickets.

      ```go
      var apiErrors = map[string]APIError{
          "E1002": {Status: 404, Message: "Oops! We couldn't find what you were looking for."},
          "E1001": {Status: 400, Message: "Something went wrong with your request. Please try again."},
          "E2001": {Status: 401, Message: "Your session has expired, please log in again."},
          "E3004": {Status: 429, Message: "Whoa, slow down! Too many requests."},
          "E1003": {Status: 409, Message: "This resource already exsits."},
      }
      ```
  - id: buzzword-offsite-skit
    prompt: |
      Write a two-minute skit for our engineering offsite. Two characters: a tired SRE, and a
      "VP of Synergy" who answers every question about last night's outage with corporate
      buzzwords (leverage, circle back, move the needle, paradigm shift, best-in-class). The
      joke is that the VP never says anything concrete. Keep it light and name nobody real.
  - id: semicolon-or-dash
    prompt: |
      English is my second language and I keep mixing these up. When is a semicolon correct,
      when is an em dash correct, and when should it just be a comma? A few example
      sentences for each would help.
  - id: cspell-allowed-words
    prompt: |
      CI fails on our docs build because cspell flags words that are spelled correctly:
      kubectl, Postgres, idempotency, Grafana, upsert. Add them to cspell.json and make it
      skip everything under docs/vendor/. This is the current file:

      ```json
      {
        "version": "0.2",
        "language": "en",
        "words": ["Helm", "Kustomize"]
      }
      ```
  - id: translate-spanish-issue
    prompt: |
      A contributor opened this issue in Spanish. Translate it into English word for word.
      Don't clean it up or shorten it, I need to know exactly what they reported so I can
      triage it.

      "Hola. Desde la versión 3.2 el comando `sync --all` se queda colgado cuando el
      directorio tiene más de 10.000 archivos. Con la 3.1 funcionaba bien. Uso macOS 15 y
      Python 3.12. Si pongo `--workers 1` termina, pero tarda una hora. ¿Es un bug o tengo
      que cambiar algo en la configuración?"
