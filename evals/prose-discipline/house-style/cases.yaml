  - id: fill-prompt-placeholders
    prompt: |
      Our support agent's system prompt lives in prompts/support.md and has placeholders like
      {product_name} and {escalation_email}. It also contains literal JSON examples with curly
      braces, so str.format() blows up with a KeyError. Write a small Python function that
